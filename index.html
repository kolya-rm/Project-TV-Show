<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Niko (kolya-rm)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <header>
      <div class="select">
        <select id="show-select" name="show"></select>
      </div>
      <div class="select">
        <select id="episode-select" name="episode"></select>
      </div>
      <div class="search">
        <input id="search-input" name="search-input" placeholder="Search episodes..." />
        <label id="search-label" for="search-input">Search:</label>
      </div>
    </header>
    <main>
      <div id="root"></div>
    </main>
    <footer>
      <p>
        All data get from TVmaze.
        <a href="https://www.tvmaze.com/api#licensing">Licensing conditions</a>.
      </p>
    </footer>
    <template id="episode-card-template">
      <div class="episode-card">
        <div class="episode-card-title">
          <h3></h3>
        </div>
        <div class="episode-card-image">
          <img src="" alt="" />
        </div>
        <div class="episode-card-summary">
          <p class="summary-text"></p>
          <p class="summary-link">View episode on <a href="">TVMaze</a></p>
        </div>
      </div>
    </template>
    <template id="show-card-template">
      <div class="show-card">
        <div class="show-card-header">
          <h1></h1>
        </div>
        <div class="show-card-body">
          <div class="show-card-image">
            <img src="" alt="" />
          </div>
          <div class="show-card-summary">
            <p></p>
          </div>
          <div class="show-card-details">
            <div class="show-card-details-seasons">
              <p></p>
            </div>
            <div class="show-card-details-genres">
              <p></p>
            </div>
            <div class="show-card-details-status">
              <p></p>
            </div>
            <div class="show-card-details-runtime">
              <p></p>
            </div>
          </div>
        </div>
      </div>
    </template>
    <!-- Loads YOUR javascript code -->
    <script src="script.js"></script>
  </body>
</html>
